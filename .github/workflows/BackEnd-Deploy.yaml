name: Deploy API BackEnd to Scaleway Serverless Containers

on:
  push:
    branches: [main]
    paths:
      - "quizApp/**"
  pull_request:
    branches: [main]
    paths:
      - "quizApp/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run go fmt
        run: |-
          cd quizApp/
          go fmt ./...

      - name: Run Go Tests
        run: |-
          cd quizApp/
          go test ./...

      - name: Run Integration Tests
        run: |-
          cd quizApp/
          go test -tags=integration ./api/... -v

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: ./quizApp
          load: true
          tags: quizapp:${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: quizapp:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Trivy vulnerability scanner (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: quizapp:${{ github.sha }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Deploy to Scaleway
        id: deploy
        uses: ./.github/actions/deploy-scaleway
        with:
          registry: rg.fr-par.scw.cloud/funcscwquizzierhg7bjpx
          registry-password: ${{ secrets.SCW_SECRET_KEY }}
          context: ./quizApp
          image-name: quizapp
          container-id: 77b86c67-27aa-426d-825f-4efca82f803c
          region: fr-par
          environment-variables: QUESTION_PATH=${{ vars.QUESTION_PATH || 'https://github.com/stclaird/quizzie.cloud/releases/latest/download/manifest.json' }}
          scw-access-key: ${{ secrets.SCW_ACCESS_KEY }}
          scw-secret-key: ${{ secrets.SCW_SECRET_KEY }}
          scw-project-id: ${{ secrets.SCW_PROJECT_ID }}
          skip-deploy: ${{ github.event_name == 'pull_request' }}

      - name: Wait for deployment to stabilize
        if: github.event_name != 'pull_request'
        run: sleep 30

      - name: Run smoke tests against production
        if: github.event_name != 'pull_request'
        env:
          API_URL: ${{ vars.API_URL || 'https://quizzierhg7bjpx-quizapp.functions.fnc.fr-par.scw.cloud' }}
        run: |
          cd quizApp/
          echo "Running smoke tests against: $API_URL"
          go test -tags=integration ./tests/... -v -timeout=5m
        continue-on-error: true

      - name: Notify on smoke test failure
        if: failure() && github.event_name != 'pull_request'
        run: |
          echo "⚠️  Smoke tests failed! Deployment may have issues."
          echo "Check the logs above for details."
