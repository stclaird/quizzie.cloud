name: Deploy API BackEnd to Scaleway Serverless Containers

on:
  push:
    branches: [main]
    paths:
      - "quizApp/**"
  pull_request:
    branches: [main]
    paths:
      - "quizApp/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run go fmt
        run: |-
          cd quizApp/
          go fmt ./...

      # - name: Run go test
      #   run: |-
      #     cd quizApp/
      #     go test ./...

      - name: Log in to Scaleway Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud/funcscwquizzierhg7bjpx
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image to Scaleway Registry
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./quizApp
          push: true
          tags: |
            rg.fr-par.scw.cloud/funcscwquizzierhg7bjpx/quizapp:latest
            rg.fr-par.scw.cloud/funcscwquizzierhg7bjpx/quizapp:${{ github.sha }}
      - name: Install Scaleway CLI
        run: |
          curl -o scw https://github.com/scaleway/scaleway-cli/releases/latest/download/scaleway-cli_2.22.0_linux_amd64
          chmod +x scw
          sudo mv scw /usr/local/bin/

      - name: Deploy to Scaleway Serverless Containers
        run: |
          scw container container update 77b86c67-27aa-426d-825f-4efca82f803c \
            --registry-image=rg.fr-par.scw.cloud/funcscwquizzierhg7bjpx/quizapp:${{ github.sha }} \
            --environment-variables="QUESTION_PATH=${{ vars.QUESTION_PATH || 'https://raw.githubusercontent.com/stclaird/questionPack/refs/heads/main/gcp-gke-b32df3c9-3274-4c2f-8769-dc409e5b5466.json' }}" \
            --region=fr-par
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
