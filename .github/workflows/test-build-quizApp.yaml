name: Test and Build QuizApp

on:
  push:
    branches: [main]
    paths:
      - "quizApp/**"
      - "api/**"
  pull_request:
    branches: [main]
    paths:
      - "quizApp/**"
      - "api/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run go fmt
        run: |-
          cd quizApp/
          go fmt ./...

      - name: Run go test
        run: |-
          cd quizApp/
          go test ./...

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./quizApp
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/quizapp:latest
            ${{ secrets.DOCKER_USERNAME }}/quizapp:${{ github.sha }}
