name: Test and Build QuizApp

on:
  push:
    branches: [main]
    paths:
      - "quizApp/**"
      - "api/**"
  pull_request:
    branches: [main]
    paths:
      - "quizApp/**"
      - "api/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Run go fmt
        run: |-
          cd quizApp/
          go fmt ./...

      # - name: Run go test
      #   run: |-
      #     cd quizApp/
      #     go test ./...

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./quizApp
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/quizapp:latest
            ${{ secrets.DOCKER_USERNAME }}/quizapp:${{ github.sha }}
      - name: Install Scaleway CLI
        if: github.event_name != 'pull_request'
        run: |
          curl -o scw https://github.com/scaleway/scaleway-cli/releases/latest/download/scaleway-cli_2.22.0_linux_amd64
          chmod +x scw
          sudo mv scw /usr/local/bin/

      - name: Deploy to Scaleway Serverless Containers
        if: github.event_name != 'pull_request'
        run: |
          scw container container deploy \
            --name=quizapp \
            --registry-image=${{ secrets.DOCKER_USERNAME }}/quizapp:${{ github.sha }} \
            --port=8080 \
            --cpu-limit=100 \
            --memory-limit=256 \
            --min-scale=0 \
            --max-scale=5 \
            --region=fr-par
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
