name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
        paths: ["quizApp/fe/**"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"
                  cache-dependency-path: quizApp/fe/package-lock.json

            - name: Install dependencies
              run: |
                  cd quizApp/fe
                  npm ci

            - name: Build web app
              run: |
                  cd quizApp/fe
                  npx expo export --platform web

            - name: Fix paths for GitHub Pages
              run: |
                  cd quizApp/fe/dist
                  # Fix absolute paths to relative paths in HTML
                  sed -i 's|href="/|href="./|g' index.html
                  sed -i 's|src="/_expo/|src="./_expo/|g' index.html
                  echo "Fixed paths in index.html:"
                  cat index.html

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: "./quizApp/fe/dist"

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
